name: mof
channels:
  - pytorch3d
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Keep the conda spec portable: pin versions, but avoid solver-fragile build strings.
  # Source installs that historically drifted (`bigym`, `robomimic`, `robosuite`,
  # `dexmimicgen`) are installed explicitly in README.
  - python=3.10
  - pip
  - cmake=3.24.3
  - cffi=1.15.1
  - cython=0.29.32
  - evdev=1.9.3
  - ipykernel=6.16
  - matplotlib=3.6.1
  - pyarrow=8.0.1
  - pytorch=2.1.0
  - pytorch-cuda=11.8
  - pytorch3d=0.7.5
  - torchaudio=2.1.0
  - torchvision=0.16.0
  - accelerate=0.13.2
  - boto3=1.24.96
  - click=8.3.1
  - datasets=2.6.1
  - diffusers=0.11.1
  - dill=0.3.5.1
  - einops=0.4.1
  - h5py=3.7.0
  - huggingface_hub=0.24.6
  - hydra-core=1.2.0
  - imageio=2.22.0
  - gym=0.21.0
  - numba=0.59.1   # latest py310 build on conda-forge (0.63.1 is py311+ only now)
  - numcodecs=0.10.2
  - numpy=1.26.4
  - psutil=5.9.2
  - pymunk=6.2.1
  - requests=2.32.5
  - scikit-image=0.19.3
  - scikit-video=1.1.11
  - scipy=1.11.4
  - shapely=1.8.4
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  - termcolor=2.0.1
  - threadpoolctl=3.1.0
  - tqdm=4.64.1
  - zarr=2.12.0
  - pip:
      # NOTE: mujoco is held at 3.3.5 on purpose (recorded demos can replay
      # differently on a different mujoco). mink wants mujoco>=3.3.6, so mink is
      # the one package that must be installed `--no-deps` in the README; every
      # other version pin lives here.
      # opencv / PyAV come from pip (their wheels bundle ffmpeg) to avoid conda's
      # ffmpeg dependency conflicts. Both are video/codec-only; cv2 is not used on
      # the training/eval path, so their versions are not result-relevant.
      - av                      # PyAV (rollout video encoding); unpinned -> ships a cp310 wheel with bundled ffmpeg
      - opencv-python==4.6.0.66
      - imageio-ffmpeg==0.4.7   # bundles a static ffmpeg; no conda ffmpeg needed
      - configargparse==1.7.1
      - daqp==0.8.5
      - dm-control==1.0.31
      - gymnasium==1.2.3
      - glfw==2.10.0
      - gdown==5.2.0
      - imagecodecs==2022.9.26
      - mujoco==3.3.5
      - mujoco-utils==0.0.6
      - numpy-quaternion==2024.0.13
      - pygame==2.6.1
      - pyopengl==3.1.10
      - timm==1.0.22
      - wandb==0.17.0
      # Direct imports by mof/ that are otherwise only pulled in transitively
      # (via datasets / timm / torch); pinned here so they don't silently drift.
      - safetensors==0.7.0
      - filelock==3.25.2
      - pandas==2.2.3
      - absl-py==2.4.0
      # bigym imports pyquaternion on its core env path and is installed
      # --no-deps (see install.sh), so this env must provide it. (pyyaml, bigym's
      # other non-env dep, already comes in transitively via hydra/omegaconf.)
      - pyquaternion==0.9.9
      # mojo's deps (mujoco / dm_control / mujoco_utils / numpy-quaternion) are
      # all unpinned, so they resolve to the versions pinned above in this pass.
      - mojo @ git+https://github.com/stepjam/mojo.git@0.1.1
