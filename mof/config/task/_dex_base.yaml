# Shared DexMimicGen task scaffold. Per-task configs inherit this via
#   defaults: [_dex_base, _self_]
# and set only: name, task_name, demos_dir (and, for the dex-hand tasks, the
# 24-DoF gripper + 30-D action shapes). Default shape_meta below is the
# parallel-jaw layout (gripper 2, action 20, no head_site obs).
# The dataset class is chosen by the *method* config via dataset_target, composed
# from this task's family tokens (ds_module/ds_class) + the method's action-rep
# tokens. The env is rebuilt from the demos hdf5 (no make_env_fn).

ds_module: dexmimicgen_replay_dataset
ds_class: DexMimicGenReplayDataset

shape_meta:
  obs:
    head_image:
      shape: [3, 84, 84]
      horizon: ${img_obs_horizon}
      type: rgb
    left_wrist_image:
      shape: [3, 84, 84]
      horizon: ${img_obs_horizon}
      type: rgb
    right_wrist_image:
      shape: [3, 84, 84]
      horizon: ${img_obs_horizon}
      type: rgb
    proprioception_grippers:
      shape: [2]
      horizon: ${low_dim_obs_horizon}
    left_ee_pos:
      shape: [3]
      horizon: ${low_dim_obs_horizon}
    left_ee_quat:
      shape: [4]
      horizon: ${low_dim_obs_horizon}
    right_ee_pos:
      shape: [3]
      horizon: ${low_dim_obs_horizon}
    right_ee_quat:
      shape: [4]
      horizon: ${low_dim_obs_horizon}
    base_pos:
      shape: [3]
      horizon: ${low_dim_obs_horizon}
    base_quat:
      shape: [4]
      horizon: ${low_dim_obs_horizon}
  action:
    shape: [20]

dataset:
  _target_: ${dataset_target}
  shape_meta: ${task.shape_meta}
  demos_dir: ${demos_dir}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.02
  n_demo: ${n_demo}

env_runner:
  _target_: mof.env_runner.dexmimicgen_image_runner.DexMimicGenImageRunner
  dataset_path: ${demos_dir}.hdf5
  shape_meta: ${task.shape_meta}
  n_train: 0
  n_train_vis: 0
  n_test: 50
  n_test_vis: 5
  test_start_seed: 100000
  max_steps: ${get_max_steps:${task_name}}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: head_image
  fps: 10
  crf: 22
  past_action: false
  tqdm_interval_sec: 1.0
  n_envs: 25
